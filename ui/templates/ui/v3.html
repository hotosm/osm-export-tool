{% load static %}
<!doctype html>
<html lang="en" class="wa-theme-default wa-palette-hotosm">
  <head>
    <!-- <base href="/v3/" /> -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>HOT Export Tool</title>
    <link href='//fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,700italic,400,300,700' rel='stylesheet' type='text/css'>
    <link rel="icon" href="{% static 'ui/images/favicon.ico' %}">
    <!-- WebAwesome theme tokens + utilities, then the HOT palette on top.
         native.css is left out on purpose: it restyles native form controls
         globally and would clash with this app's Bootstrap 3 styles. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.11.0/dist/styles/themes/default.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.11.0/dist/styles/utilities.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hotosm/ui@2.1.2/dist/style-core.css">
    <script type="importmap">
      {
        "imports": {
          "@awesome.me/webawesome/dist/components/": "https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.11.0/dist-cdn/components/"
        }
      }
    </script>
    <!-- The WebAwesome elements <hot-tool-menu> renders, then the menu itself.
         Static imports run in order, so the wa-* tags are defined first. -->
    <script type="module">
      import "@awesome.me/webawesome/dist/components/button/button.js";
      import "@awesome.me/webawesome/dist/components/dropdown/dropdown.js";
      import "@awesome.me/webawesome/dist/components/dropdown-item/dropdown-item.js";
      import "@awesome.me/webawesome/dist/components/icon/icon.js";
      import "https://cdn.jsdelivr.net/npm/@hotosm/ui@2.1.2/dist/components/tool-menu/tool-menu.js";
    </script>
    {% if AUTH_PROVIDER == "hanko" %}
    <script type="module" src="https://cdn.jsdelivr.net/npm/@hotosm/hanko-auth@0.5.2/dist/hanko-auth.esm.js"></script>
    {% endif %}
    {% if MATOMO_URL and MATOMO_SITEID %}
      <script type="text/javascript">
        var _paq = window._paq = window._paq || [];
        /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
        _paq.push(['trackPageView']);
        _paq.push(['enableLinkTracking']);
        (function() {
          var u='{{ MATOMO_URL }}';
          _paq.push(['setTrackerUrl', u+'piwik.php']);
          _paq.push(['setSiteId', '{{ MATOMO_SITEID }}']);
          var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
          g.type='text/javascript'; g.async=true; g.src=u+'piwik.js'; s.parentNode.insertBefore(g,s);
        })();
      </script>
    {% endif %}
  </head>
  <body>
    <div id="root" class="container-fluid" style="height:calc(100% - 105px)"></div>
    <script>
      var EXPORTS_API_URL = "{{ request.scheme }}://{{ request.get_host }}";
      var OAUTH_CLIENT_ID = "{{ client_id }}";
      var RAW_DATA_API_URL = "{{ RAW_DATA_API_URL }}";
      var AUTH_PROVIDER = "{{ AUTH_PROVIDER }}";
      {% if AUTH_PROVIDER == "hanko" %}
      var HANKO_URL = "{{ HANKO_PUBLIC_URL }}";
      {% endif %}
    </script>
    <script src="{% static 'ui/js/bundle.js' %}"></script>
  </body>
</html>
